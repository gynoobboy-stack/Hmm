<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spring memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="spring-bg">

<div class="sky">
  <span class="heart h1">❤</span>
  <span class="heart h2">❤</span>
  <span class="heart h3">❤</span>
  <span class="heart h4">❤</span>
  <span class="heart h5">❤</span>
  <span class="heart h6">❤</span>
</div>

<main class="card story-card">
  <div class="photo-frame spring-frame">
    <img id="springPhoto" src="spring.jpg" alt="spring memory 1" class="comic-photo">
  </div>

  <p class="subtext" id="springCaption">a spring memory, part 1</p>

  <div class="loading-wrap">
    <div class="loading-track">
      <div class="loading-fill" id="loadingFill"></div>
      <div class="loading-icon" id="loadingIcon">🥟</div>
    </div>
    <p class="loading-percent" id="loadingPercent">0%</p>
  </div>

  <div class="hold-wrap">
    <button id="holdBtn" class="hold-btn heart-hold-btn" aria-label="hold">♡</button>
  </div>
</main>

<script src="spring-fall.js"></script>
<script>
  const photos = [
    "spring.jpg",
    "spring1.jpg",
    "spring2.jpg",
    "spring3.jpg",
    "spring4.jpg",
    "spring5.jpg",
    "spring6.jpg",
    "spring7.jpg",
    "spring8.jpg",
    "spring9.jpg",
  ];

  // Placeholder captions — edit these to whatever you want each photo to say.
  const captions = [
    "a spring memory, part 1",
    "a spring memory, part 2",
    "a spring memory, part 3",
    "a spring memory, part 4",
    "a spring memory, part 5",
    "a spring memory, part 6",
    "a spring memory, part 7",
    "a spring memory, part 8",
    "a spring memory, part 9",
    "a spring memory, part 10",
  ];

  const springPhoto = document.getElementById("springPhoto");
  const springCaption = document.getElementById("springCaption");
  const loadingFill = document.getElementById("loadingFill");
  const loadingIcon = document.getElementById("loadingIcon");
  const loadingPercent = document.getElementById("loadingPercent");
  const holdBtn = document.getElementById("holdBtn");

  let index = 0;
  let holding = false;
  let percent = 0;

  function loadScreen(i) {
    springPhoto.src = photos[i];
    springPhoto.alt = `spring memory ${i + 1}`;
    springCaption.textContent = captions[i];
    percent = 0;
    updateLoadingDisplay();
  }

  function updateLoadingDisplay() {
    loadingFill.style.width = percent + "%";
    loadingIcon.style.left = percent + "%";
    loadingPercent.textContent = Math.round(percent) + "%";

    if (percent >= 100) {
      index++;
      if (index < photos.length) {
        setTimeout(() => loadScreen(index), 400);
      } else {
        setTimeout(() => {
          window.location.href = "page6.html";
        }, 600);
      }
    }
  }

  function startHold(e) {
    e.preventDefault();
    holding = true;
  }
  function endHold() {
    holding = false;
  }

  holdBtn.addEventListener("mousedown", startHold);
  holdBtn.addEventListener("touchstart", startHold, { passive: false });
  holdBtn.addEventListener("mouseup", endHold);
  holdBtn.addEventListener("mouseleave", endHold);
  holdBtn.addEventListener("touchend", endHold);
  holdBtn.addEventListener("touchcancel", endHold);

  setInterval(() => {
    if (percent >= 100) return;
    if (holding) {
      percent = Math.min(100, percent + 1.25);
    } else {
      percent = Math.max(0, percent - 1.25);
    }
    updateLoadingDisplay();
  }, 80);

  loadScreen(0);
</script>
</body>
</html>
